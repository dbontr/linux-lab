name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch verified boot artifacts
        run: npm run sync:distros
      - name: Build Alpine browser image
        run: sudo bash distro-build/alpine/build.sh
      - name: Restore x86-64 QEMU runtime
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: public/qemu
          key: qemu-wasm-${{ runner.os }}-${{ hashFiles('runtime-build/qemu/**') }}
      - name: Build x86-64 QEMU runtime
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: bash runtime-build/qemu/build.sh
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
