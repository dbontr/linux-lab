<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linux Lab VM</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050607; }
      body { display: grid; place-items: center; }
      canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; outline: 0; }
      #log { position: absolute; inset: 0; margin: 0; padding: 12px; overflow: auto; color: #dce5df; background: #050607; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
      #log[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="screen" tabindex="0"></canvas>
    <pre id="log" aria-live="polite">Initializing x86-64 runtime…</pre>
    <script type="module" src="./qemu-host.js"></script>
  </body>
</html>
